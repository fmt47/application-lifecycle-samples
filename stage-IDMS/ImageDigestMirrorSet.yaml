# =============================================================================
# This file lives in the Git repo the AppSub points to:
#   repo:   https://github.com/fmt47/application-lifecycle-samples
#   branch: main
#   path:   stage-IDMS/          (Subscription annotation git-path: stage-IDMS)
#
# The application-manager addon on each selected spoke pulls and applies it.
# The IDMS reconfigures CRI-O (via a MachineConfig rollout) to pull the listed
# sources from stage. Covers the classic addons that MCIR cannot reach, plus
# platform / CAPI images.
# =============================================================================
apiVersion: config.openshift.io/v1
kind: ImageDigestMirrorSet
metadata:
  name: image-mirror-custom
  annotations:
    # Keep this IDMS on the spoke even if the AppSub/Subscription is deleted or
    # the cluster leaves the placement. Without this, the subscription addon
    # garbage-collects it -> mirror removed -> MachineConfig rollback -> the
    # ImagePullBackOff deadlock returns. This is bootstrap-critical, so retain it.
    apps.open-cluster-management.io/do-not-delete: "true"
spec:
  imageDigestMirrors:
    # ACM / MCE agent + addon images
    - source: registry.redhat.io/rhacm2
      mirrors:
        - registry.stage.redhat.io/rhacm2
    - source: registry.redhat.io/multicluster-engine
      mirrors:
        - registry.stage.redhat.io/multicluster-engine
    # CAPI provider images
    - source: registry.redhat.io/openshift4/ose-aws-cluster-api-controllers-rhel9
      mirrors:
        - registry.stage.redhat.io/openshift4/ose-aws-cluster-api-controllers-rhel9
    - source: registry.redhat.io/openshift4/ose-cluster-api-rhel9
      mirrors:
        - registry.stage.redhat.io/openshift4/ose-cluster-api-rhel9
    - source: registry.redhat.io/openshift4/ose-baremetal-cluster-api-controllers-rhel9
      mirrors:
        - registry.stage.redhat.io/openshift4/ose-baremetal-cluster-api-controllers-rhel9
    # oauth-proxy
    - source: registry.access.redhat.com/openshift4/ose-oauth-proxy
      mirrors:
        - registry.redhat.io/openshift4/ose-oauth-proxy